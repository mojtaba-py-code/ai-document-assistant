name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job gets a read-only token unless it declares more below.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy, strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: mypy
        run: uv run mypy

  import-linter:
    name: Architecture contracts (import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: lint-imports
        run: uv run lint-imports

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          # Throw-away server on the ephemeral runner: trust auth, so no credential exists.
          # The suite creates its own database and least-privilege roles (tests/conftest.py).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Available on localhost:6379 for tests that need a real server (the default suite
      # uses fakeredis).
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DOCASSIST_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python }}
      - name: pytest (unit, integration, security, adversarial; with coverage)
        run: >-
          uv run pytest -p no:cacheprovider
          --cov=docassist --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=junit.xml
      - name: Upload coverage and test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-py${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security (bandit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Bandit (static analysis of src)
        run: uv run bandit -c pyproject.toml -r src
      - name: pip-audit (known vulnerabilities in the hash-pinned runtime dependencies)
        run: |
          sh scripts/export-requirements.sh --output requirements.audit.txt --all-extras
          uv run pip-audit --requirement requirements.audit.txt --require-hashes \
            --disable-pip --progress-spinner off

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # list the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_VERSION: "8.30.1" # same as the pre-commit hook
          GITLEAKS_ENABLE_COMMENTS: "false" # read-only token: report in the job log only

  deployment:
    name: Deployment config (shellcheck, compose, kustomize)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: >-
          shellcheck --severity=warning
          scripts/*.sh deployment/postgres/initdb/*.sh deployment/postgres/backup/*.sh
      - name: Throw-away secrets for config rendering
        run: |
          bash scripts/generate-secrets.sh --with-tls
          printf '%s' ci-placeholder > deployment/secrets/anthropic_api_key
          printf '%s' ci-placeholder > deployment/secrets/embedding_api_key
      - name: docker compose config (base, every override, and all combined)
        env:
          DOCASSIST_PUBLIC_BASE_URL: https://docs.example.com
          DOCASSIST_ALLOWED_HOSTS: '["docs.example.com","127.0.0.1"]'
          DOCASSIST_OUTBOUND_ALLOWED_HOSTS: '["api.anthropic.com","embeddings.example.com"]'
          DOCASSIST_EMBEDDING_BASE_URL: https://embeddings.example.com/v1
          DOCASSIST_EMBEDDING_MODEL: ci-model
        run: |
          docker compose config --quiet
          for override in deployment/compose/*.yaml; do
            echo "compose.yaml + ${override}"
            docker compose -f compose.yaml -f "${override}" config --quiet
          done
          docker compose -f compose.yaml \
            -f deployment/compose/qdrant.yaml -f deployment/compose/clamav.yaml \
            -f deployment/compose/ollama.yaml -f deployment/compose/anthropic.yaml \
            config --quiet
      - name: kustomize build
        run: kubectl kustomize deployment/kubernetes > /dev/null

  container:
    name: Container image (build, smoke test, SBOM, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the Trivy SARIF to code scanning
    env:
      IMAGE: docassist:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: docassist:ci
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The runtime stage runs `apt-get upgrade`: restored from the cache, that layer would
          # replay the packages of its first build and never pick up a later security fix.
          no-cache-filters: runtime
      - name: Image policy (non-root, health check, no pip, CLI starts)
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"
          test "$(docker image inspect --format '{{json .Config.Healthcheck}}' "$IMAGE")" != "null"
          docker run --rm --read-only --cap-drop ALL --entrypoint python "$IMAGE" -c \
            "import importlib.util, sys; sys.exit(importlib.util.find_spec('pip') is not None)"
          docker run --rm --read-only --cap-drop ALL "$IMAGE" --help > /dev/null
      - name: End-to-end smoke test (docker compose, default stack)
        env:
          DOCASSIST_IMAGE: docassist:ci
        run: |
          bash scripts/generate-secrets.sh
          docker compose up -d --no-build
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/health/ready; then
              break
            fi
            sleep 3
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          # The migration ran to completion as the schema owner.
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet migrate)")" = 0
          # Data stores publish nothing on the host.
          if docker compose port postgres 5432 >/dev/null 2>&1; then echo "::error::postgres port is published"; exit 1; fi
          if docker compose port redis 6379 >/dev/null 2>&1; then echo "::error::redis port is published"; exit 1; fi
          docker compose ps
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Compose down
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: SBOM (SPDX JSON, uploaded as an artifact)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: docassist:ci
          format: spdx-json
          output-file: sbom-docassist.spdx.json
          artifact-name: sbom-docassist.spdx.json
          upload-release-assets: false
          dependency-snapshot: false
      - name: Trivy report (SARIF, all fixable findings from MEDIUM up)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docassist:ci
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"
      - name: Upload Trivy results to code scanning
        # Forked pull requests get a read-only token; the table gate below still applies.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy gate (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docassist:ci
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
