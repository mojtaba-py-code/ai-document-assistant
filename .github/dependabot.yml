# Weekly, grouped updates. Actions and base images are pinned by commit SHA / digest, so
# Dependabot's pull requests are the only way they move - review them like code.
version: 2
updates:
  # Python dependencies: pyproject.toml ranges + the committed uv.lock, updated together.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    groups:
      runtime-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-python-env
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images (tag + digest pins).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    ignore:
      # Stay on Python 3.12 and Debian bookworm until a deliberate upgrade.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      base-images:
        patterns: ["*"]

  # Service images in compose.yaml (PostgreSQL/pgvector, Redis, Qdrant, ClamAV, Ollama).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    allow:
      # Third-party images only. docassist is built from this repository (the
      # docker entry tracks its base image) and Docker Hub has no repository by
      # that name, so looking it up failed the whole docker-compose update job.
      - dependency-name: "*/*"
      - dependency-name: "redis"
    ignore:
      # Major versions (PostgreSQL 16 -> 17, Redis 7 -> 8) need a planned migration.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      compose-images:
        patterns: ["*"]
