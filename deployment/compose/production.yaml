# Override: production-safe settings for a single host. docassist refuses to start in
# production with any development shortcut (see core/config.py::_check_production), so this
# file supplies every required piece:
#
#   * DOCASSIST_ENVIRONMENT=production: HSTS, Secure cookies, API docs off, DEBUG logs refused
#   * TLS between the application and PostgreSQL (hostssl-only pg_hba, TLS >= 1.2)
#   * ClamAV scanning of every upload (the clamav service starts automatically)
#   * external AI: Claude for answers, an OpenAI-compatible embeddings endpoint
#   * a TLS reverse proxy in front (deployment/nginx/docassist.conf) - the API itself stays
#     on 127.0.0.1:8000
#
# One-time preparation:
#   scripts/generate-secrets.sh --with-tls
#   printf '%s' "$ANTHROPIC_API_KEY" > deployment/secrets/anthropic_api_key
#   printf '%s' "$EMBEDDING_API_KEY" > deployment/secrets/embedding_api_key
#
# Required variables (compose refuses to start without them), e.g. in the shell or a
# compose --env-file that contains no secrets:
#   DOCASSIST_PUBLIC_BASE_URL=https://docs.example.com
#   DOCASSIST_ALLOWED_HOSTS='["docs.example.com","127.0.0.1"]'   # keep 127.0.0.1: health check
#   DOCASSIST_OUTBOUND_ALLOWED_HOSTS='["api.anthropic.com","embeddings.example.com"]'
#   DOCASSIST_EMBEDDING_BASE_URL=https://embeddings.example.com/v1
#   DOCASSIST_EMBEDDING_MODEL=<model name>
# Optional: DOCASSIST_TRUSTED_PROXIES='["172.16.0.0/12"]' (the proxy's source address as
# seen by the container, so X-Forwarded-For is honoured only from it).
#
#   docker compose -f compose.yaml -f deployment/compose/production.yaml up -d

x-production-environment: &production-environment
  DOCASSIST_ENVIRONMENT: production
  DOCASSIST_PUBLIC_BASE_URL: ${DOCASSIST_PUBLIC_BASE_URL:?set DOCASSIST_PUBLIC_BASE_URL to the public https URL}
  DOCASSIST_SECURITY__ALLOWED_HOSTS: ${DOCASSIST_ALLOWED_HOSTS:?set DOCASSIST_ALLOWED_HOSTS to a JSON list of host names}
  DOCASSIST_SECURITY__TRUSTED_PROXIES: ${DOCASSIST_TRUSTED_PROXIES:-[]}
  DOCASSIST_SECURITY__COOKIE_SECURE: "true"
  DOCASSIST_SECURITY__EXPOSE_API_DOCS: "false"
  DOCASSIST_DATABASE__SSL: require
  DOCASSIST_UPLOAD__MALWARE_SCANNER: clamav
  DOCASSIST_UPLOAD__CLAMAV_HOST: clamav
  DOCASSIST_UPLOAD__CLAMAV_PORT: "3310"
  DOCASSIST_LLM__PROVIDER: anthropic
  DOCASSIST_LLM__ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
  DOCASSIST_EMBEDDING__PROVIDER: openai_compatible
  DOCASSIST_EMBEDDING__BASE_URL: ${DOCASSIST_EMBEDDING_BASE_URL:?set DOCASSIST_EMBEDDING_BASE_URL}
  DOCASSIST_EMBEDDING__MODEL: ${DOCASSIST_EMBEDDING_MODEL:?set DOCASSIST_EMBEDDING_MODEL}
  DOCASSIST_EMBEDDING__API_KEY_FILE: /run/secrets/embedding_api_key
  DOCASSIST_OUTBOUND__ALLOWED_HOSTS: ${DOCASSIST_OUTBOUND_ALLOWED_HOSTS:?set DOCASSIST_OUTBOUND_ALLOWED_HOSTS to a JSON list}
  DOCASSIST_OBSERVABILITY__LOG_LEVEL: INFO

services:
  postgres:
    # The server key must be owned by the postgres user with mode 0600, which a bind-mounted
    # secret cannot guarantee: copy it into the tmpfs socket directory first.
    entrypoint:
      - /bin/sh
      - -c
      - install -m 0600 /run/secrets/postgres_tls.key /var/run/postgresql/server.key && exec docker-entrypoint.sh "$$@"
      - docker-entrypoint
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/postgres_tls.crt
      - -c
      - ssl_key_file=/var/run/postgresql/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/docassist/pg_hba.conf
    volumes:
      - ./deployment/postgres/pg_hba.production.conf:/etc/docassist/pg_hba.conf:ro
    secrets:
      - source: postgres_tls_cert
        target: postgres_tls.crt
      - source: postgres_tls_key
        target: postgres_tls.key

  clamav:
    profiles: !reset []

  api:
    environment: *production-environment
    secrets: [anthropic_api_key, embedding_api_key]
    depends_on:
      clamav:
        condition: service_healthy

  worker:
    environment: *production-environment
    secrets: [anthropic_api_key, embedding_api_key]
    depends_on:
      clamav:
        condition: service_healthy

secrets:
  postgres_tls_cert:
    file: ./deployment/secrets/postgres_tls.crt
  postgres_tls_key:
    file: ./deployment/secrets/postgres_tls.key
  anthropic_api_key:
    file: ./deployment/secrets/anthropic_api_key
  embedding_api_key:
    file: ./deployment/secrets/embedding_api_key
