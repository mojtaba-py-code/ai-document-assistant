# CPU-based autoscaling (metrics-server). minReplicas 2 keeps the PodDisruptionBudgets
# satisfiable during drains. For the worker, queue depth is the better signal: KEDA's
# PostgreSQL scaler on the jobs table (status = 'queued') can replace the CPU metric.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docassist-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docassist-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docassist-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docassist-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      # Scale in slowly: a terminating worker drains its running jobs first.
      stabilizationWindowSeconds: 600
