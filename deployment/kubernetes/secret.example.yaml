# Shape of the "docassist-secrets" Secret when External Secrets Operator is not used.
# NOT part of kustomization.yaml and intentionally EMPTY: fill it from your secret manager at
# deploy time, e.g.
#   kubectl -n docassist create secret generic docassist-secrets \
#     --from-file=deployment/secrets/database_url --from-file=... (one per key)
# and never commit a filled-in copy (*.secret.yaml is gitignored in this directory).
apiVersion: v1
kind: Secret
metadata:
  name: docassist-secrets
  namespace: docassist
  labels:
    app.kubernetes.io/name: docassist
type: Opaque
stringData:
  database_url: ""
  database_worker_url: ""
  database_migration_url: ""
  redis_url: ""
  jwt_signing_key: ""
  token_pepper: ""
  audit_hmac_key: ""
  encryption_keys: ""
  encryption_key_id: ""
  metrics_token: ""
  anthropic_api_key: ""
  embedding_api_key: ""
