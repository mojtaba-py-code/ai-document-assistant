apiVersion: apps/v1
kind: Deployment
metadata:
  name: docassist-api
  labels:
    app.kubernetes.io/name: docassist
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: docassist
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docassist
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: docassist
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: docassist
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: ghcr.io/mojtaba-py-code/ai-document-assistant:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: docassist-config
          env:
            - name: DOCASSIST_DATABASE__URL_FILE
              value: /run/secrets/docassist/database_url
            - name: DOCASSIST_REDIS__URL_FILE
              value: /run/secrets/docassist/redis_url
            - name: DOCASSIST_SECURITY__JWT_SIGNING_KEY_FILE
              value: /run/secrets/docassist/jwt_signing_key
            - name: DOCASSIST_SECURITY__TOKEN_PEPPER_FILE
              value: /run/secrets/docassist/token_pepper
            - name: DOCASSIST_SECURITY__AUDIT_HMAC_KEY_FILE
              value: /run/secrets/docassist/audit_hmac_key
            - name: DOCASSIST_SECURITY__ENCRYPTION_KEYS_FILE
              value: /run/secrets/docassist/encryption_keys
            - name: DOCASSIST_SECURITY__ACTIVE_ENCRYPTION_KEY_ID_FILE
              value: /run/secrets/docassist/encryption_key_id
            - name: DOCASSIST_SECURITY__METRICS_TOKEN_FILE
              value: /run/secrets/docassist/metrics_token
            - name: DOCASSIST_LLM__ANTHROPIC_API_KEY_FILE
              value: /run/secrets/docassist/anthropic_api_key
            - name: DOCASSIST_EMBEDDING__API_KEY_FILE
              value: /run/secrets/docassist/embedding_api_key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # The kubelet sends "Host: <pod IP>" by default, which TrustedHostMiddleware rejects;
          # "localhost" is in DOCASSIST_SECURITY__ALLOWED_HOSTS for exactly this purpose.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: storage
              mountPath: /var/lib/docassist
            - name: secrets
              mountPath: /run/secrets/docassist
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: storage
          persistentVolumeClaim:
            claimName: docassist-storage
        # Only the keys the API needs; files are 0440 and readable through fsGroup 10001.
        - name: secrets
          secret:
            secretName: docassist-secrets
            defaultMode: 0440
            items:
              - { key: database_url, path: database_url }
              - { key: redis_url, path: redis_url }
              - { key: jwt_signing_key, path: jwt_signing_key }
              - { key: token_pepper, path: token_pepper }
              - { key: audit_hmac_key, path: audit_hmac_key }
              - { key: encryption_keys, path: encryption_keys }
              - { key: encryption_key_id, path: encryption_key_id }
              - { key: metrics_token, path: metrics_token }
              - { key: anthropic_api_key, path: anthropic_api_key }
              - { key: embedding_api_key, path: embedding_api_key }
