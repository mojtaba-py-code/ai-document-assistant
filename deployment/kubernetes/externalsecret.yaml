# External Secrets Operator: materialises the "docassist-secrets" Secret from your secret
# manager (Vault, AWS/GCP/Azure secret stores, ...). No secret value lives in this repository.
# Each pod mounts only the keys it needs (see the Deployments and the migration Job).
#
# Key contents (the same files scripts/generate-secrets.sh creates for compose):
#   database_url            postgresql+asyncpg://docassist_app:<pw>@<host>:5432/docassist
#   database_worker_url     same for docassist_worker
#   database_migration_url  same for docassist_owner (schema owner; migration Job only)
#   redis_url               rediss://docassist:<pw>@<host>:6380/0
#   jwt_signing_key, token_pepper, audit_hmac_key   >= 32 random bytes each, all different
#   encryption_keys         kid:base64(32 bytes)[,older-kid:...]   (key ring)
#   encryption_key_id       the active kid
#   metrics_token           bearer token for /metrics
#   anthropic_api_key, embedding_api_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docassist-secrets
  labels:
    app.kubernetes.io/name: docassist
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: docassist-secret-store # REPLACE with your (Cluster)SecretStore
  target:
    name: docassist-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database_url
      remoteRef: { key: docassist/production, property: database_url }
    - secretKey: database_worker_url
      remoteRef: { key: docassist/production, property: database_worker_url }
    - secretKey: database_migration_url
      remoteRef: { key: docassist/production, property: database_migration_url }
    - secretKey: redis_url
      remoteRef: { key: docassist/production, property: redis_url }
    - secretKey: jwt_signing_key
      remoteRef: { key: docassist/production, property: jwt_signing_key }
    - secretKey: token_pepper
      remoteRef: { key: docassist/production, property: token_pepper }
    - secretKey: audit_hmac_key
      remoteRef: { key: docassist/production, property: audit_hmac_key }
    - secretKey: encryption_keys
      remoteRef: { key: docassist/production, property: encryption_keys }
    - secretKey: encryption_key_id
      remoteRef: { key: docassist/production, property: encryption_key_id }
    - secretKey: metrics_token
      remoteRef: { key: docassist/production, property: metrics_token }
    - secretKey: anthropic_api_key
      remoteRef: { key: docassist/production, property: anthropic_api_key }
    - secretKey: embedding_api_key
      remoteRef: { key: docassist/production, property: embedding_api_key }
