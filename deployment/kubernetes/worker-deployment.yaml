# Background worker: job queue (ingestion, vector sync, exports) + maintenance (audit
# sealing, lease reclaim, retention purges - guarded by an advisory lock, so any number of
# replicas is safe). It serves no HTTP, so there is no Service and no HTTP probe; a crashed
# worker exits and the kubelet restarts it, and jobs of a lost worker are reclaimed when their
# lease expires.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docassist-worker
  labels:
    app.kubernetes.io/name: docassist
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: docassist
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docassist
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: docassist
      automountServiceAccountToken: false
      enableServiceLinks: false
      # > DOCASSIST_WORKER__SHUTDOWN_GRACE_SECONDS (30 s): SIGTERM stops claiming, running
      # jobs get the grace period to finish.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: docassist
              app.kubernetes.io/component: worker
      containers:
        - name: worker
          image: ghcr.io/mojtaba-py-code/ai-document-assistant:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: docassist-config
          env:
            - name: DOCASSIST_DATABASE__URL_FILE
              value: /run/secrets/docassist/database_url
            - name: DOCASSIST_DATABASE__WORKER_URL_FILE
              value: /run/secrets/docassist/database_worker_url
            - name: DOCASSIST_REDIS__URL_FILE
              value: /run/secrets/docassist/redis_url
            - name: DOCASSIST_SECURITY__JWT_SIGNING_KEY_FILE
              value: /run/secrets/docassist/jwt_signing_key
            - name: DOCASSIST_SECURITY__TOKEN_PEPPER_FILE
              value: /run/secrets/docassist/token_pepper
            - name: DOCASSIST_SECURITY__AUDIT_HMAC_KEY_FILE
              value: /run/secrets/docassist/audit_hmac_key
            - name: DOCASSIST_SECURITY__ENCRYPTION_KEYS_FILE
              value: /run/secrets/docassist/encryption_keys
            - name: DOCASSIST_SECURITY__ACTIVE_ENCRYPTION_KEY_ID_FILE
              value: /run/secrets/docassist/encryption_key_id
            - name: DOCASSIST_SECURITY__METRICS_TOKEN_FILE
              value: /run/secrets/docassist/metrics_token
            - name: DOCASSIST_LLM__ANTHROPIC_API_KEY_FILE
              value: /run/secrets/docassist/anthropic_api_key
            - name: DOCASSIST_EMBEDDING__API_KEY_FILE
              value: /run/secrets/docassist/embedding_api_key
          # Parser sandboxes run as child processes inside this limit
          # (parser.max_concurrency x parser.memory_limit_mb).
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: storage
              mountPath: /var/lib/docassist
            - name: secrets
              mountPath: /run/secrets/docassist
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: storage
          persistentVolumeClaim:
            claimName: docassist-storage
        - name: secrets
          secret:
            secretName: docassist-secrets
            defaultMode: 0440
            items:
              - { key: database_url, path: database_url }
              - { key: database_worker_url, path: database_worker_url }
              - { key: redis_url, path: redis_url }
              - { key: jwt_signing_key, path: jwt_signing_key }
              - { key: token_pepper, path: token_pepper }
              - { key: audit_hmac_key, path: audit_hmac_key }
              - { key: encryption_keys, path: encryption_keys }
              - { key: encryption_key_id, path: encryption_key_id }
              - { key: metrics_token, path: metrics_token }
              - { key: anthropic_api_key, path: anthropic_api_key }
              - { key: embedding_api_key, path: embedding_api_key }
