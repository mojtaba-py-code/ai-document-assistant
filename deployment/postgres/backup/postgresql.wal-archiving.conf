# Continuous WAL archiving for point-in-time recovery (self-managed PostgreSQL 16).
# Include from postgresql.conf (`include_if_exists = 'wal-archiving.conf'`) or pass the same
# settings with `-c` in the compose postgres command. Managed services: use their PITR
# feature instead and skip this file.
#
# Backup strategy for docassist
# -----------------------------
#   * nightly    pg-basebackup.sh (physical, whole cluster) + WAL archive  -> PITR, RPO ~5 min
#   * nightly    pg-dump.sh / scripts/backup.sh (logical)                  -> table-level restores,
#                                                                              major-version upgrades
#   * always     the object store volume (encrypted blobs) with the same schedule, and the
#                key ring (encryption_keys) plus the audit HMAC key in a secret manager -
#                without them restored blobs cannot be decrypted and the audit chain
#                cannot be verified.
#   * monthly    scripts/restore.sh --drill (and a PITR drill on a scratch host): an
#                untested backup is not a backup.
#
# Point-in-time recovery, in short:
#   1. stop PostgreSQL; move the damaged data directory aside;
#   2. copy the base backup directory (pg-basebackup.sh) into an empty data directory;
#   3. set restore_command (below) and recovery_target_time = '2026-01-31 14:05:00+00';
#   4. touch <datadir>/recovery.signal and start PostgreSQL; it replays archived WAL up to
#      the target and pauses (recovery_target_action = 'pause') for you to inspect;
#   5. SELECT pg_wal_replay_resume(); then re-point the application.

wal_level = replica
archive_mode = on
# Copy each completed WAL segment to the archive; never overwrite (a name collision means two
# clusters share an archive - fail loudly instead). Replace with your tool of choice
# (pgBackRest, WAL-G, barman) for compression, encryption and off-site shipping.
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'
# Force a segment switch at least every 5 minutes, bounding data loss on an idle system.
archive_timeout = 300

# Used only during recovery:
restore_command = 'cp /var/lib/postgresql/wal-archive/%f %p'
recovery_target_action = 'pause'
