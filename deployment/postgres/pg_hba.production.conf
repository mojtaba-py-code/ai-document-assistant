# Client authentication for the production compose override
# (deployment/compose/production.yaml mounts this file and sets hba_file).
#
# * Every TCP connection must use TLS ("hostssl") and SCRAM-SHA-256; plain "host" lines are
#   deliberately absent, so a client that does not negotiate TLS is rejected.
# * Local socket connections (initdb scripts, maintenance via `docker compose exec`) need the
#   role's password as well - there is no "trust" anywhere.
# * Each application role may connect only to the docassist database; the superuser only
#   through the socket inside the container.

# TYPE    DATABASE   USER               ADDRESS   METHOD
local     all        all                          scram-sha-256
hostssl   docassist  docassist_app      all       scram-sha-256
hostssl   docassist  docassist_worker   all       scram-sha-256
hostssl   docassist  docassist_owner    all       scram-sha-256
