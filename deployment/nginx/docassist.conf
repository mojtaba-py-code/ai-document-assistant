# TLS reverse proxy for docassist (example - replace docs.example.com and the certificate
# paths). Include it from the http {} block of nginx >= 1.25.1, e.g.
#   /etc/nginx/conf.d/docassist.conf
#
# The API container listens on 127.0.0.1:8000 only (compose.yaml). Matching application
# settings:
#   DOCASSIST_PUBLIC_BASE_URL=https://docs.example.com
#   DOCASSIST_SECURITY__ALLOWED_HOSTS=["docs.example.com","127.0.0.1"]
#   DOCASSIST_SECURITY__TRUSTED_PROXIES=[<address nginx connects from, as the container sees it>]
#     (only then does the API honour X-Forwarded-For / X-Forwarded-Proto)
#
# Defence in depth: these limits sit in front of the application's own per-user/per-account
# rate limits (Redis GCRA) and body-size limits - they do not replace them.

# --- rate limiting (per client address) ---------------------------------------------------
limit_req_zone $binary_remote_addr zone=docassist_api:10m rate=20r/s;
# Credential endpoints: password guessing and reset-mail flooding.
limit_req_zone $binary_remote_addr zone=docassist_credentials:10m rate=10r/m;
# LLM-backed endpoints are expensive; the application also enforces per-user/org budgets.
limit_req_zone $binary_remote_addr zone=docassist_ai:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=docassist_conn:10m;
limit_req_status 429;
limit_conn_status 429;

upstream docassist_api {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# --- plain HTTP: ACME challenges and a redirect, nothing else -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS --------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.example.com;
    server_tokens off;

    # Mozilla "intermediate" profile (TLS 1.2 + 1.3).
    ssl_certificate /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DocassistTLS:10m;
    ssl_session_tickets off;

    # HSTS is set here, once, for every response (including nginx's own errors and
    # redirects); the application's copy is hidden so the header is never duplicated.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Request size and slow-client protection. 51m = upload.max_upload_bytes (50 MiB) plus
    # multipart overhead; the application enforces the exact limits per route. Bodies are
    # buffered here, so a slow upload never ties up an application worker.
    client_max_body_size 51m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 16k;
    limit_conn docassist_conn 50;

    # Proxy headers. X-Forwarded-For is *replaced* with the connecting address (nginx is
    # the first hop), so a client cannot inject a forged chain.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # LLM answers may take up to DOCASSIST_LLM__REQUEST_TIMEOUT_SECONDS (120 s) plus retrieval.
    proxy_read_timeout 180s;
    proxy_redirect off;

    location = /api/v1/auth/login {
        limit_req zone=docassist_credentials burst=5 nodelay;
        proxy_pass http://docassist_api;
    }

    location ~ ^/api/v1/auth/(mfa/verify|password/forgot|password/reset)$ {
        limit_req zone=docassist_credentials burst=5 nodelay;
        proxy_pass http://docassist_api;
    }

    location ~ ^/api/v1/assistant/(ask|agent)$ {
        limit_req zone=docassist_ai burst=10 nodelay;
        proxy_pass http://docassist_api;
    }

    # Prometheus metrics are scraped on the internal network, never through the edge.
    location = /metrics {
        return 404;
    }

    location / {
        limit_req zone=docassist_api burst=40 nodelay;
        proxy_pass http://docassist_api;
    }
}
