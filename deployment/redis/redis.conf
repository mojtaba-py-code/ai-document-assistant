# Redis for docassist: cache, GCRA rate limiter and token revocation only - it holds nothing
# that cannot be rebuilt, so persistence is off and memory is bounded.
#
# Authentication and authorisation come from the ACL file generated by
# scripts/generate-secrets.sh (mounted as a Docker secret). It contains only the SHA-256 of
# the application password and defines:
#   default    enabled without a password but restricted to PING (container health check)
#   docassist  keys "docassist:*" only, no pub/sub channels, +@all -@dangerous
#              (no FLUSHALL/FLUSHDB/KEYS/CONFIG/DEBUG/SHUTDOWN/MONITOR/REPLICAOF/ACL ...)

# Network: reachable only on the internal compose "backend" network (no published port).
bind * -::*
protected-mode yes
port 6379
tcp-keepalive 60
timeout 0
maxclients 2000

# Access control.
aclfile /run/secrets/redis_users.acl
enable-debug-command no
enable-module-command no
enable-protected-configs no

# Memory: bounded; only keys with a TTL are evicted. docassist's cache (Cache.set_json) and
# rate limiter (GCRA script, PX) always set one, so a full instance evicts the least recently
# used entries instead of rejecting writes.
maxmemory 256mb
maxmemory-policy volatile-lru

# Persistence: none (appendonly off, no RDB snapshots).
appendonly no
save ""

loglevel notice
logfile ""
