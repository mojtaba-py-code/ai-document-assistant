<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Secure document intelligence and AI assistant for your organisation.">
  <title>AI Document Assistant</title>
  <link rel="icon" href="/static/icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" id="skip-link">Skip to main content</a>
  <div id="app" class="app-root">
    <div class="boot" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading AI Document Assistant&hellip;</span>
    </div>
  </div>
  <div id="live-region" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-relevant="additions"></div>
  <noscript>
    <p class="noscript">AI Document Assistant needs JavaScript enabled in your browser.</p>
  </noscript>

</html>
